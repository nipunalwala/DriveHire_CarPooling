name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run docs:check
      - run: npm run build
      - run: docker build --target api -f docker/Dockerfile -t drivehire-api:ci .
      - run: docker build --target web -f docker/Dockerfile -t drivehire-web:ci .
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm install --global npm@11.19.1
      - run: npm ci
      - run: node scripts/init-local-env.mjs
      - run: docker compose -f compose.test.yml up -d --wait --wait-timeout 300
      - run: npm run test:integration
      - run: npm run infra:check
      - if: always()
        run: docker compose -f compose.test.yml down --volumes
