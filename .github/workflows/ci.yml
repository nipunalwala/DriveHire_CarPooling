name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: drivehire
          POSTGRES_PASSWORD: drivehire
          POSTGRES_DB: drivehire_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U drivehire -d drivehire_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://drivehire:drivehire@localhost:5432/drivehire_test
      TEST_DATABASE_URL: postgres://drivehire:drivehire@localhost:5432/drivehire_test
      JWT_ACCESS_SECRET: test-secret-value-at-least-thirty-two-characters-long
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: docker build -f docker/server.Dockerfile .
      - run: docker build -f docker/client.Dockerfile .
