services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: drivehire_test
      POSTGRES_PASSWORD: local_test_only
      POSTGRES_DB: drivehire_test
    ports:
      - '127.0.0.1:55432:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drivehire_test -d drivehire_test']
      interval: 2s
      timeout: 3s
      retries: 30
