services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: drivehire
      POSTGRES_PASSWORD: drivehire
      POSTGRES_DB: drivehire_dev
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drivehire -d drivehire_dev']
      interval: 3s
      timeout: 3s
      retries: 20
  server:
    build: { context: ., dockerfile: docker/server.Dockerfile }
    environment:
      NODE_ENV: development
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-use-a-long-local-secret-000000}
      DATABASE_URL: postgres://drivehire:drivehire@db:5432/drivehire_dev
      COOKIE_SECURE: 'false'
      UPLOAD_DIR: /app/uploads
    volumes: ['uploads:/app/uploads']
    depends_on: { db: { condition: service_healthy } }
    ports: ['5000:5000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
  client:
    build: { context: ., dockerfile: docker/client.Dockerfile }
    depends_on: [server]
    ports: ['8080:8080']
volumes:
  pgdata:
  uploads:
