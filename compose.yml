name: drivehire-dev
services:
  database:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run local env initialization}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run local env initialization}
      POSTGRES_DB: drivehire_dev
      RUNTIME_DB_USER: drivehire_runtime
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run local env initialization}
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres-dev:/var/lib/postgresql/data
      - ./docker/postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  scanner:
    image: clamav/clamav@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
    ports: ['127.0.0.1:3310:3310']
    volumes: ['clamav-dev:/var/lib/clamav']
  api:
    profiles: [application]
    build: &api-build
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment: &application-env
      NODE_ENV: development
      PORT: 4000
      APP_ORIGIN: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      DATABASE_URL: postgresql://drivehire_runtime:${RUNTIME_DB_PASSWORD}@database:5432/drivehire_dev
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SCAN_HOST: scanner
      SCAN_PORT: 3310
      STORAGE_PRIVATE_ROOT: /data/private
    ports: ['127.0.0.1:4000:4000']
    volumes: ['private-storage:/data/private']
    depends_on:
      database:
        condition: service_healthy
  worker:
    profiles: [application]
    build: *api-build
    command: ['node', 'apps/api/dist/worker.js']
    environment: *application-env
    volumes: ['private-storage:/data/private']
    depends_on:
      database:
        condition: service_healthy
  web:
    profiles: [application]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    ports: ['127.0.0.1:8080:8080']
    depends_on: [api]
volumes:
  postgres-dev:
  clamav-dev:
  private-storage:
